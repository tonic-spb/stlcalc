<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Командировка: служебная записка, приказ, задание — генератор</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #e8e8e8; display: flex; min-height: 100vh; }

  /* ---------- Левая панель ---------- */
  #panel { width: 400px; flex-shrink: 0; background: #fff; padding: 20px; overflow-y: auto; max-height: 100vh; border-right: 1px solid #ccc; }
  #panel h2 { margin-top: 0; font-size: 18px; }
  #panel h3 { margin: 16px 0 4px; font-size: 14px; color: #2f6db3; }
  #panel label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; color: #333; }
  #panel input[type="text"], #panel input[type="date"], #panel input[type="number"], #panel textarea {
    width: 100%; padding: 7px 9px; font-size: 14px; border: 1px solid #bbb; border-radius: 5px;
  }
  #panel textarea { resize: vertical; min-height: 48px; }
  #panel details { margin-top: 14px; border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; }
  #panel summary { cursor: pointer; font-weight: 600; font-size: 13px; color: #555; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .hint { font-size: 11px; color: #888; margin-top: 2px; }

  table.exp-input { width: 100%; border-collapse: collapse; margin-top: 6px; }
  table.exp-input th { font-size: 12px; text-align: left; padding: 4px 2px; color: #555; }
  table.exp-input td { padding: 3px 2px; vertical-align: middle; }
  table.exp-input input[type="text"], table.exp-input input[type="number"] { padding: 5px 7px; font-size: 13px; }
  .pay-toggle { display: flex; gap: 2px; }
  .pay-toggle button { flex: 1; padding: 5px 0; font-size: 12px; cursor: pointer; border: 1px solid #bbb; background: #f4f4f4; border-radius: 4px; }
  .pay-toggle button.active { background: #2f6db3; color: #fff; border-color: #2f6db3; }
  .del-row { border: none; background: none; color: #c0392b; font-size: 16px; cursor: pointer; padding: 2px 6px; }
  #add-row { margin-top: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; border: 1px dashed #2f6db3; color: #2f6db3; background: #fff; border-radius: 5px; width: 100%; }
  #total-line { margin-top: 10px; font-size: 15px; font-weight: 700; }
  #print-btn { margin-top: 18px; width: 100%; padding: 12px; font-size: 16px; font-weight: 700; background: #2f6db3; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  #print-btn:hover { background: #255a94; }
  #word-btn { margin-top: 10px; width: 100%; padding: 12px; font-size: 16px; font-weight: 700; background: #2e7d32; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  #word-btn:hover { background: #256528; }

  /* ---------- Листы ---------- */
  #sheets { flex: 1; padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .sheet {
    position: relative; background: #fff; width: 794px; min-height: 1123px; padding: 48px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); color: #000; align-self: center; overflow: hidden;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheet.land { width: 1123px; min-height: 794px; }
  .doc-label { position: absolute; top: 8px; left: 12px; font-size: 11px; color: #bbb; z-index: 5; font-family: "Segoe UI", Arial, sans-serif; }

  /* Служебка (бланк) */
  .vst { font-family: Calibri, Carlito, "Segoe UI", sans-serif; font-size: 10pt; }
  .vst p { margin: 0 0 6pt; line-height: 1.15; }
  .vst .watermark { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 523pt; height: 504pt; z-index: 0; pointer-events: none; }
  .vst .watermark img { width: 100%; height: 100%; }
  .vst .content { position: relative; z-index: 1; }
  table.letterhead { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; margin-bottom: 16px; }
  table.letterhead td { vertical-align: top; padding: 1px 4px; }
  .lh-logo { width: 46%; }
  .lh-logo img { width: 170pt; }
  .lh-label { width: 20%; text-align: right; font-size: 9pt; padding-right: 8px !important; }
  .lh-value { font-size: 9pt; line-height: 1.25; }
  .lh-company { text-align: right; font-size: 10pt; }
  .lh-ref { font-size: 9pt; line-height: 1.4; }
  .vst .top-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .vst .approve { text-align: right; line-height: 1.3; font-size: 9pt; margin: 0; flex-shrink: 0; }
  .vst .header-to { line-height: 1.15; margin: 0; }
  .vst h1 { text-align: left; font-size: 11pt; font-weight: bold; margin: 0 0 6pt; }
  .vst .lbl { font-weight: bold; }
  table.exp-doc { width: 100%; border-collapse: collapse; margin: 6px 0 6pt; font-size: 10pt; }
  table.exp-doc th, table.exp-doc td { border: 1px solid #000; padding: 3px 6px; text-align: center; }
  table.exp-doc td.name { text-align: left; }
  table.exp-doc td.sum { text-align: right; white-space: nowrap; }
  .vst .sign { margin-top: 60px; display: flex; align-items: flex-end; gap: 12px; }
  .vst .sign .sig { flex: 1; height: 1.2em; max-width: 220px; position: relative; }
  .vst .sign .sig img { position: absolute; top: 50%; transform: translateY(-50%); left: 26px; height: 75px; }

  /* Приказ и задание — Arial, как в оригиналах */
  .form-doc { font-family: Arial, sans-serif; font-size: 10pt; }
  .form-doc p { margin: 2pt 0; }
  .form-doc .sm { font-size: 7.5pt; }
  .form-doc .u-line { border-bottom: 1pt solid #000; text-align: center; padding: 0 4px; }
  .form-doc .u-span { text-decoration: underline; }
  .form-doc table { border-collapse: collapse; }
  .form-doc td { padding: 0; vertical-align: bottom; }
  .fd-box td { border: 1pt solid #000; padding: 1pt 6pt; text-align: center; font-size: 9pt; white-space: nowrap; }

  /* ---------- Печать ---------- */
  @page { size: A4 landscape; margin: 12.7mm; }
  @page port { size: A4 portrait; margin: 12.7mm; }
  @media print {
    body { background: #fff; display: block; }
    #panel { display: none; }
    #sheets { padding: 0; display: block; }
    .sheet { width: auto; min-height: auto; box-shadow: none; padding: 0; overflow: visible; page: port; }
    #sheet-prikaz { page-break-before: always; }
    .sheet.land { page: land; width: auto; min-height: auto; position: static; }
    .doc-label { display: none; }
    .sheet.vst { min-height: 250mm; position: relative; }
    .vst .watermark { transform: none; top: 47mm; left: 50%; margin-left: -92.2mm; }
  }
</style>
</head>
<body>

<div id="panel">
  <h2>Заявка на командировку</h2>
  <div class="hint">Служебная записка · Приказ (Т-9) · Служебное задание (Т-10а)</div>

  <h3>Командировка</h3>
  <label for="f-date">Дата составления документов</label>
  <input type="date" id="f-date">

  <label for="f-route">Маршрут</label>
  <input type="text" id="f-route">

  <label for="f-goal">Цель командировки</label>
  <textarea id="f-goal"></textarea>

  <div class="row2">
    <div><label for="f-city">Город</label><input type="text" id="f-city"></div>
    <div><label for="f-org">Организация</label><input type="text" id="f-org"></div>
  </div>

  <div class="row2">
    <div><label for="f-dep">Дата убытия</label><input type="date" id="f-dep"></div>
    <div><label for="f-arr">Дата прибытия</label><input type="date" id="f-arr"></div>
  </div>

  <h3>Затраты (для служебной записки)</h3>
  <table class="exp-input">
    <thead>
      <tr><th style="width:44%">Наименование</th><th style="width:20%">Сумма, руб.</th><th style="width:28%">Форма оплаты</th><th></th></tr>
    </thead>
    <tbody id="exp-rows"></tbody>
  </table>
  <button id="add-row" type="button">+ Добавить строку затрат</button>
  <div id="total-line">Итого: <span id="total-val">0,00</span> руб.</div>

  <details id="emp-block">
    <summary>Данные сотрудника</summary>
    <label for="f-fio">ФИО полностью</label>
    <input type="text" id="f-fio">
    <label for="f-fio-short">ФИО кратко (для подписи)</label>
    <input type="text" id="f-fio-short">
    <label for="f-fio-gen">ФИО кратко в род. падеже («от кого»)</label>
    <input type="text" id="f-fio-gen">
    <label for="f-pos">Должность</label>
    <input type="text" id="f-pos">
    <label for="f-pos-gen">Должность в род. падеже («от кого»)</label>
    <input type="text" id="f-pos-gen">
    <label for="f-dept">Подразделение</label>
    <input type="text" id="f-dept">
    <label for="f-sig">Подпись (картинка png, необязательно)</label>
    <input type="file" id="f-sig" accept="image/*">
  </details>

  <button id="print-btn" type="button" onclick="window.print()">Печать / Сохранить в PDF</button>
  <button id="word-btn" type="button">Скачать Word (.doc)</button>
</div>

    <div class="content" id="doc-zadanie"></div>
  </div></div><script>
/* ================= Данные и экранный рендер ================= */
var IS_MINE = false;
var SIG_SRC = "";
var expenses = [];

function g(id) { return document.getElementById(id); }
function v(id) { return g(id).value; }
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
}
function fmtMoney(n) {
  var p = Number(n || 0).toFixed(2).split(".");
  return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ") + "," + p[1];
}
function fd(iso) {
  if (!iso) return "«___» ________ 20___";
  var p = iso.split("-");
  return p[2] + "." + p[1] + "." + p[0];
}
function fdShort(iso) { /* 28/09/26 */
  if (!iso) return "__/__/__";
  var p = iso.split("-");
  return p[2] + "/" + p[1] + "/" + p[0].slice(2);
}
function toISO(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function daysWord(n) {
  var a = n % 10, b = n % 100;
  if (a === 1 && b !== 11) return "календарный день";
  if (a >= 2 && a <= 4 && (b < 10 || b >= 20)) return "календарных дня";
  return "календарных дней";
}
function tripDays() {
  var dep = v("f-dep"), arr = v("f-arr");
  return (dep && arr) ? Math.round((new Date(arr) - new Date(dep)) / 86400000) + 1 : 0;
}
function route() {
  var r = v("f-route").trim();
  if (r) return r;
  var c = v("f-city").trim();
  return c ? "Москва — " + c + " — Москва" : "";
}
function orgCity() {
  var o = v("f-org").trim(), c = v("f-city").trim();
  if (o && c) return o + ", " + c;
  return o || c;
}
function sigImg(style) {
  return SIG_SRC ? '<img src="' + SIG_SRC + '" style="' + (style || "") + '">' : "";
}
</script>

<script>
/* ================= Служебная записка (экран) ================= */

function renderZapiska() {
  var rows = expenses, total = 0, tc = 0, tb = 0;
  var body = "";
  rows.forEach(function (r) {
    var sum = r.sum || 0;
    total += sum;
    if (r.pay === "cash") tc += sum; else tb += sum;
    body += '<tr><td class="name">' + (esc(r.name) || "&nbsp;") + '</td>' +
      '<td class="sum">' + (r.pay === "cash" && sum ? fmtMoney(sum) : "") + '</td>' +
      '<td class="sum">' + (r.pay === "bank" && sum ? fmtMoney(sum) : "") + '</td></tr>';
  });
  g("total-val").textContent = fmtMoney(total);

  var posGen = v("f-pos-gen").trim() || (v("f-pos").trim() ? v("f-pos").trim().toLowerCase() + "а" : "");
  var fioGen = v("f-fio-gen").trim();
  var headerTo = 'ООО «Аврора Карбон Технолоджи»<br>Генеральному директору<br>Лустину П.Б.<br><br>' +
    (posGen ? 'От ' + esc(posGen) : 'От __________') + '<br>' + (esc(fioGen) || "__________");

  g("doc-zap").innerHTML = letterheadScreen() +
    '<div class="top-row">' +
      '<div class="header-to">' + headerTo + '</div>' +
      '<div class="approve">Согласовано: __________________<br>Дата: ' + fd(v("f-date")) + '</div>' +
    '</div>' +
    '<h1>СЛУЖЕБНАЯ ЗАПИСКА</h1>' +
    '<p>Прошу согласовать служебную поездку по маршруту ' + (esc(route()) || "________________") + '</p>' +
    '<p><span class="lbl">Цель:</span> ' + (esc(v("f-goal")) || "________________") + '</p>' +
    '<p><span class="lbl">Наименование предприятий, город:</span> ' + (esc(orgCity()) || "________________") + '</p>' +
    '<p><span class="lbl">Дата убытия:</span> ' + fd(v("f-dep")) + '</p>' +
    '<p><span class="lbl">Дата прибытия:</span> ' + fd(v("f-arr")) + '</p>' +
    '<p><span class="lbl">Затраты:</span></p>' +
    '<table class="exp-doc"><thead>' +
      '<tr><th rowspan="2" style="width:50%">Наименование затрат</th><th colspan="2">Сумма затрат</th></tr>' +
      '<tr><th style="width:26%">Наличная форма оплаты</th><th style="width:24%">Безналичная форма оплаты</th></tr>' +
    '</thead><tbody>' + body + '</tbody><tfoot>' +
      '<tr><td class="name"><b>Итого</b></td><td class="sum"><b>' + (tc ? fmtMoney(tc) : "") + '</b></td>' +
      '<td class="sum"><b>' + (tb ? fmtMoney(tb) : "") + '</b></td></tr></tfoot></table>' +
    '<p>Затраты <b>' + fmtMoney(total) + ' руб.</b></p>' +
    '<p>Прошу перечислить необходимые подотчетные средства за период с ' + fd(v("f-dep")) + ' г. по ' + fd(v("f-arr")) +

function boxTable(rows) {
  /* rows: [[label, value], ...] — левый столбец без рамки, правый в рамке */
  var s = '<table class="fd-box">';
  rows.forEach(function (r) {
    s += '<tr><td style="border:none;text-align:right;padding-right:4pt;">' + r[0] + '</td><td>' + r[1] + '</td></tr>';
  });
  return s + '</table>';
}

  function makeName() {
    var org = v("f-org").trim().replace(/\s+/g, " ");
    var city = v("f-city").trim();
    var dates = (v("f-dep") && v("f-arr")) ? ddmmLocal(v("f-dep")) + "-" + ddmmLocal(v("f-arr")) : "";

    if (org) { name += " - " + org; if (city) name += ", " + city; }

    if (dates) name += " " + dates;
    return name.replace(/[\\/:*?"<>|]/g, " ").replace(/\s+/g, " ").trim() + ".doc";
