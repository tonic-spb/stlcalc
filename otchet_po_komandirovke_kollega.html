<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отчет по командировке: авансовый отчет, отчет о встрече — генератор</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #e8e8e8; display: flex; min-height: 100vh; }

  /* ---------- Левая панель ---------- */
  #panel { width: 400px; flex-shrink: 0; background: #fff; padding: 20px; overflow-y: auto; max-height: 100vh; border-right: 1px solid #ccc; }
  #panel h2 { margin-top: 0; font-size: 18px; }
  #panel h3 { margin: 16px 0 4px; font-size: 14px; color: #2f6db3; }
  #panel label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; color: #333; }
  #panel input[type="text"], #panel input[type="date"], #panel input[type="number"], #panel textarea {
    width: 100%; padding: 7px 9px; font-size: 14px; border: 1px solid #bbb; border-radius: 5px;
  }
  #panel textarea { resize: vertical; min-height: 48px; }
  #panel details { margin-top: 14px; border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; }
  #panel summary { cursor: pointer; font-weight: 600; font-size: 13px; color: #555; }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .hint { font-size: 11px; color: #888; margin-top: 2px; }

  .ex-card { border: 1px solid #ddd; border-radius: 6px; padding: 8px; margin-top: 8px; position: relative; }
  .ex-card .grid { display: grid; grid-template-columns: 3fr 2fr; gap: 6px; }
  .ex-card input { width: 100%; padding: 5px 7px; font-size: 13px; border: 1px solid #bbb; border-radius: 4px; }
  .ex-card .del-row { position: absolute; top: 2px; right: 4px; border: none; background: none; color: #c0392b; font-size: 16px; cursor: pointer; padding: 2px 6px; }
  #add-row { margin-top: 8px; padding: 7px 12px; font-size: 13px; cursor: pointer; border: 1px dashed #2f6db3; color: #2f6db3; background: #fff; border-radius: 5px; width: 100%; }
  #total-line { margin-top: 10px; font-size: 15px; font-weight: 700; }
  #print-btn { margin-top: 18px; width: 100%; padding: 12px; font-size: 16px; font-weight: 700; background: #2f6db3; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  #print-btn:hover { background: #255a94; }
  #word-btn { margin-top: 10px; width: 100%; padding: 12px; font-size: 16px; font-weight: 700; background: #2e7d32; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  #word-btn:hover { background: #256528; }

  /* ---------- Листы ---------- */
  #sheets { flex: 1; padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
  .sheet {
    position: relative; background: #fff; width: 794px; min-height: 1123px; padding: 48px;
    box-shadow: 0 2px 10px rgba(0,0,0,.25); color: #000; align-self: center; overflow: hidden;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheet.ao { width: 1123px; min-height: 794px; }
  .doc-label { position: absolute; top: 8px; left: 12px; font-size: 11px; color: #bbb; z-index: 5; font-family: "Segoe UI", Arial, sans-serif; }

  /* Авансовый отчет — Arial */
  .ao { font-family: Arial, sans-serif; font-size: 10pt; }
  .ao p { margin: 2pt 0; }
  .ao .sm { font-size: 7.5pt; }
  table.ao-t { width: 100%; border-collapse: collapse; margin-top: 8pt; }
  table.ao-t th, table.ao-t td { border: 1px solid #000; padding: 2px 4px; font-size: 9pt; }
  table.ao-t th { font-size: 9.5pt; }

  /* Отчет о встрече — фирменный бланк, Times New Roman */
  .mtg { font-family: "Times New Roman", Times, serif; font-size: 12pt; }
  .mtg p { margin: 0; line-height: 1.15; }
  .mtg .watermark { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 523pt; height: 504pt; z-index: 0; pointer-events: none; }
  .mtg .watermark img { width: 100%; height: 100%; }
  .mtg .content { position: relative; z-index: 1; }
  .mtg h1 { text-align: center; font-size: 12pt; font-weight: bold; margin: 0 0 6pt; }
  .mtg .fld { margin-left: 10pt; font-weight: bold; }
  table.letterhead { width: 100%; border-collapse: collapse; font-family: Arial, sans-serif; margin-bottom: 16px; }
  table.letterhead td { vertical-align: top; padding: 1px 4px; }
  .lh-logo { width: 46%; }
  .lh-logo img { width: 170pt; }
  .lh-label { width: 20%; text-align: right; font-size: 9pt; padding-right: 8px !important; }
  .lh-value { font-size: 9pt; line-height: 1.25; }
  .lh-company { text-align: right; font-size: 10pt; }
  .lh-ref { font-size: 9pt; line-height: 1.4; }

  /* ---------- Печать ---------- */
  @page { size: A4 portrait; margin: 12.7mm; }
  @page port { size: A4 portrait; margin: 12.7mm; }
  @page land { size: A4 landscape; margin: 12.7mm; }
  @media print {
    body { background: #fff; display: block; }
    #panel { display: none; }
    #sheets { padding: 0; display: block; }
    .sheet { width: auto; min-height: auto; box-shadow: none; padding: 0; overflow: visible; }
    .sheet.ao { page: land; position: static; width: auto; min-height: auto; }
    .sheet.mtg { page: port; }
    .doc-label { display: none; }
    .sheet.mtg { min-height: 250mm; position: relative; }
    .mtg .watermark { transform: none; top: 47mm; left: 50%; margin-left: -92.2mm; }
  }
</style>
</head>
<body>

<div id="panel">
  <h2>Отчет по командировке</h2>
  <div class="hint">Авансовый отчет · Отчет о проведении встречи</div>

  <h3>Командировка</h3>
  <label for="f-date">Дата составления документов</label>
  <input type="date" id="f-date">

  <label for="f-goal">Цель (строка в авансовом отчете)</label>
  <textarea id="f-goal"></textarea>

  <label for="f-city">Город</label>
  <input type="text" id="f-city">

  <div class="row2">
    <div><label for="f-dep">Дата начала</label><input type="date" id="f-dep"></div>
    <div><label for="f-arr">Дата окончания</label><input type="date" id="f-arr"></div>
  </div>

  <h3>Получено авансом</h3>
  <div class="row2">
    <div><label for="a-recdate">Дата получения</label><input type="date" id="a-recdate"></div>
    <div><label for="a-recsum">Сумма, руб.</label><input type="number" id="a-recsum" min="0" step="0.01"></div>
  </div>

  <h3>Расходы (подтверждающие документы)</h3>
  <div id="exp-cards"></div>
  <button id="add-row" type="button">+ Добавить документ</button>
  <div id="total-line">Итого по таблице: <span id="total-val">0.00</span> руб.</div>

  <h3>Отчет о встрече</h3>
  <label for="m-when">Когда</label>
  <input type="date" id="m-when">
  <label for="m-place">Место проведения</label>
  <input type="text" id="m-place">
  <label for="m-who">Кто (представители другой стороны)</label>
  <textarea id="m-who"></textarea>
  <label for="m-our">От ООО «Аврора Карбон Технолоджи»</label>
  <input type="text" id="m-our">
  <label for="m-topic">Тема</label>
  <textarea id="m-topic"></textarea>
  <label for="m-result">Результат</label>
  <textarea id="m-result"></textarea>

  <details id="emp-block">
    <summary>Данные сотрудника</summary>
    <label for="f-fio-short">ФИО кратко (для подписи)</label>
    <input type="text" id="f-fio-short">
    <label for="f-sig">Подпись (картинка png, необязательно)</label>
    <input type="file" id="f-sig" accept="image/*">
  </details>

  <button id="print-btn" type="button" onclick="window.print()">Печать / Сохранить в PDF</button>
  <button id="word-btn" type="button">Скачать Word (.doc)</button>
</div>

<div id="sheets">

    <div class="content" id="doc-avans"></div>

<script>
/* ================= Данные и утилиты ================= */
var IS_MINE = false;
var SIG_SRC = "";
var expenses = [];
var MONTHS = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];

function g(id) { return document.getElementById(id); }
function v(id) { return g(id).value; }
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
}
function fmtUS(n) { /* 6,742.00 — как в образце авансового */
  var p = Number(n || 0).toFixed(2).split(".");
  return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",") + "." + p[1];
}
function fd(iso) {
  if (!iso) return "";
  var p = iso.split("-");
  return p[2] + "." + p[1] + "." + p[0];
}
function toISO(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function ddmmLocal(iso) { if (!iso) return ""; var p = iso.split("-"); return p[2] + "." + p[1]; }
function fioShort() { return v("f-fio-short").trim(); }
function sigImg(style) {
  return SIG_SRC ? '<img src="' + SIG_SRC + '" style="' + (style || "") + '">' : "";
}
function totalExp() {
  var t = 0;
  expenses.forEach(function (r) { t += r.sum || 0; });
  return t;
}
function dateSostav() { /* "14" октября 2026 г. */
  var d = v("f-date");
  if (!d) return '"___" __________ 20___ г.';
  var p = d.split("-");
  return '"' + p[2] + '" ' + MONTHS[+p[1] - 1] + ' ' + p[0] + ' г.';
}
</script>

<script>
/* ================= Авансовый отчет (экран, альбомная) ================= */
function renderAvans() {
  var received = parseFloat(v("a-recsum")) || 0;
  var total = totalExp();
  var diff = received - total;
  var ost = diff > 0 ? fmtUS(diff) : "";
  var over = diff < 0 ? fmtUS(-diff) : "";
  g("total-val").textContent = fmtUS(total);

  var rowsHtml = "";
  for (var i = 0; i < 10; i++) {
    var r = expenses[i] || { name: "", num: "", date: "", sum: 0, memo: "" };
    rowsHtml += '<tr><td style="text-align:center;">' + (i + 1) + '</td>' +
      '<td>' + (esc(r.name) || "&nbsp;") + '</td>' +
      '<td>' + (esc(r.num) || "&nbsp;") + '</td>' +
      '<td style="text-align:center;">' + (r.date ? fd(r.date) : "&nbsp;") + '</td>' +
      '<td style="text-align:right;">' + (r.sum ? fmtUS(r.sum) : "&nbsp;") + '</td>' +
      '<td>' + (esc(r.memo) || "&nbsp;") + '</td></tr>';
  }

  g("doc-avans").innerHTML =

<script>
/* ================= Ввод и инициализация ================= */
function renderInputs() {
  var box = g("exp-cards");
  box.innerHTML = "";
  expenses.forEach(function (row, i) {
    var card = document.createElement("div");
    card.className = "ex-card";

    var del = document.createElement("button");
    del.type = "button"; del.className = "del-row"; del.title = "Удалить документ"; del.textContent = "×";
    del.addEventListener("click", function () { expenses.splice(i, 1); renderInputs(); renderAll(); });
    card.appendChild(del);

    var grid = document.createElement("div");
    grid.className = "grid";

    function mkInput(type, val, ph, oninput) {
      var inp = document.createElement("input");
      inp.type = type; if (val) inp.value = val;
      if (type === "number") { inp.min = "0"; inp.step = "0.01"; }
      inp.addEventListener("input", oninput);
      return inp;
    }

    grid.appendChild(mkInput("text", row.name, "Наименование документа (Билет, Справка...)", function (e) { row.name = e.target.value; renderAll(); }));
    grid.appendChild(mkInput("text", row.num, "Номер", function (e) { row.num = e.target.value; renderAll(); }));
    grid.appendChild(mkInput("date", row.date, "", function (e) { row.date = e.target.value; renderAll(); }));
    grid.appendChild(mkInput("number", row.sum || "", "Сумма, руб.", function (e) { row.sum = parseFloat(e.target.value) || 0; renderAll(); }));
    var memo = mkInput("text", row.memo, "На что потрачено", function (e) { row.memo = e.target.value; renderAll(); });
    memo.style.gridColumn = "1 / -1";
    grid.appendChild(memo);

    card.appendChild(grid);
    box.appendChild(card);
  });
}

function renderAll() { renderAvans(); renderVst(); }

g("f-date").value = toISO(new Date());
expenses = [
  { name: "", num: "", date: "", sum: 0, memo: "" },
  { name: "", num: "", date: "", sum: 0, memo: "" },
  { name: "", num: "", date: "", sum: 0, memo: "" }
];

if (IS_MINE) {
  g("f-fio-short").value = "Чернов М.Ю.";
}

g("add-row").addEventListener("click", function () {
  expenses.push({ name: "", num: "", date: "", sum: 0, memo: "" });
  renderInputs(); renderAll();
});
["f-date","f-goal","f-city","f-dep","f-arr","a-recdate","a-recsum",
 "m-when","m-place","m-who","m-our","m-topic","m-result","f-fio-short"]
  .forEach(function (id) { g(id).addEventListener("input", renderAll); });
g("f-sig").addEventListener("change", function () {
  var f = g("f-sig").files[0];
  if (!f) return;
  var r = new FileReader();
  r.onload = function () { SIG_SRC = r.result; renderAll(); };
  r.readAsDataURL(f);
});

renderInputs();
renderAll();
</script>
